<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="referrer" content="no-referrer" />
  <link rel="icon" type="image/png" href="/logo-512.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0A0E17" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Apex AI">
  <link rel="apple-touch-icon" href="/logo-512.png">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&display=swap" />
  <link rel="preload" as="image" href="/assets/logo.webp" fetchpriority="high" type="image/webp" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Apex AI Football President</title>
  <style>
    /* Custom scrollbar for a more modern look */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #020617;
      /* slate-950 */
    }

    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      /* slate-800 */
      border-radius: 4px;
      border: 2px solid #020617;
      /* slate-950 */
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #334155;
      /* slate-700 */
    }

    /* Screen transition animation */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(15px) scale(0.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .content-fade-in {
      animation: fadeIn 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
    }
  </style>
</head>

<body class="bg-slate-950 text-slate-200 antialiased overscroll-none">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then((reg) => console.log('Service Worker registered'))
          .catch((err) => console.log('Service Worker failed', err));
      });
    }
  </script>
</body>

</html>
