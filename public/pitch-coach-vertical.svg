<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2160 3270" width="2160" height="3270">
  <defs>
    <linearGradient id="boardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b2419"/>
      <stop offset="50%" stop-color="#0f3122"/>
      <stop offset="100%" stop-color="#0a2016"/>
    </linearGradient>
    <pattern id="tacticalGrid" width="180" height="180" patternUnits="userSpaceOnUse">
      <path d="M 180 0 L 0 0 0 180" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="3"/>
    </pattern>
    <linearGradient id="stripe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.025"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.025"/>
    </linearGradient>
  </defs>

  <!-- Tactical board dark emerald slate -->
  <rect width="2160" height="3270" fill="url(#boardBg)"/>
  <rect width="2160" height="3270" fill="url(#tacticalGrid)"/>

  <!-- Subtle mowed stripes -->
  <g opacity="0.55">
    <rect x="0" y="135" width="2160" height="250" fill="#14402b" fill-opacity="0.28"/>
    <rect x="0" y="635" width="2160" height="250" fill="#14402b" fill-opacity="0.28"/>
    <rect x="0" y="1135" width="2160" height="250" fill="#14402b" fill-opacity="0.28"/>
    <rect x="0" y="1635" width="2160" height="250" fill="#14402b" fill-opacity="0.28"/>
    <rect x="0" y="2135" width="2160" height="250" fill="#14402b" fill-opacity="0.28"/>
    <rect x="0" y="2635" width="2160" height="250" fill="#14402b" fill-opacity="0.28"/>
  </g>
  <rect width="2160" height="3270" fill="url(#stripe)"/>

  <!-- Clipboard / Coach frame accents -->
  <rect x="44" y="44" width="2072" height="3182" rx="44" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="8"/>
  <rect x="780" y="18" width="600" height="36" rx="18" fill="#1e293b" stroke="#94a3b8" stroke-opacity="0.4" stroke-width="4"/>

  <!-- Chalk pitch markings -->
  <g fill="none" stroke="#e2f8ea" stroke-opacity="0.72" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer touchlines & goal lines -->
    <rect x="130" y="135" width="1900" height="3000" rx="6"/>

    <!-- Halfway line & center circle -->
    <line x1="130" y1="1635" x2="2030" y2="1635"/>
    <circle cx="1080" cy="1635" r="265"/>
    <circle cx="1080" cy="1635" r="16" fill="#e2f8ea" fill-opacity="0.85" stroke="none"/>

    <!-- Top penalty area & 6-yard box -->
    <rect x="520" y="135" width="1120" height="470"/>
    <rect x="795" y="135" width="570" height="175"/>
    <rect x="935" y="90" width="290" height="45" stroke-opacity="0.5"/>
    <circle cx="1080" cy="450" r="14" fill="#e2f8ea" fill-opacity="0.85" stroke="none"/>
    <path d="M 865 605 A 265 265 0 0 0 1295 605"/>

    <!-- Bottom penalty area & 6-yard box -->
    <rect x="520" y="2665" width="1120" height="470"/>
    <rect x="795" y="2960" width="570" height="175"/>
    <rect x="935" y="3135" width="290" height="45" stroke-opacity="0.5"/>
    <circle cx="1080" cy="2820" r="14" fill="#e2f8ea" fill-opacity="0.85" stroke="none"/>
    <path d="M 865 2665 A 265 265 0 0 1 1295 2665"/>

    <!-- Corner arcs -->
    <path d="M 130 190 A 55 55 0 0 0 185 135"/>
    <path d="M 1975 135 A 55 55 0 0 0 2030 190"/>
    <path d="M 130 3080 A 55 55 0 0 1 185 3135"/>
    <path d="M 1975 3135 A 55 55 0 0 1 2030 3080"/>
  </g>

  <!-- Subtle tactical chalk arrows / zones -->
  <g fill="none" stroke="#38bdf8" stroke-opacity="0.18" stroke-width="5" stroke-dasharray="18 18">
    <line x1="130" y1="1135" x2="2030" y2="1135"/>
    <line x1="130" y1="2135" x2="2030" y2="2135"/>
    <line x1="763" y1="135" x2="763" y2="3135"/>
    <line x1="1397" y1="135" x2="1397" y2="3135"/>
  </g>
</svg>
